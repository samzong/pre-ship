name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify and publish
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_REF: refs/tags/${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0

      - name: Verify SemVer tag and PEP 440 package versions
        id: meta
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import runpy
          import subprocess
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          release_core = r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)"
          match = re.fullmatch(release_core + r"(?:-(alpha|beta|rc)\.(0|[1-9][0-9]*))?", tag)
          if not match:
              raise SystemExit("Invalid SemVer release tag.")
          major, minor, patch, stage, number = match.groups()
          expected = f"{major}.{minor}.{patch}"
          if stage:
              expected += {"alpha": "a", "beta": "b", "rc": "rc"}[stage] + number
          with open("pyproject.toml", "rb") as source:
              actual = tomllib.load(source)["project"]["version"]
          if actual != expected:
              raise SystemExit("pyproject.toml version does not match the release tag.")
          runtime = runpy.run_path("src/pre_ship/__init__.py")["__version__"]
          if runtime != actual:
              raise SystemExit("pre_ship.__version__ does not match pyproject.toml.")
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          target = subprocess.check_output(["git", "rev-parse", f"refs/tags/{tag}^{{commit}}"], text=True).strip()
          if head != target:
              raise SystemExit("HEAD does not match the release tag commit.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"is_prerelease={'true' if stage else 'false'}\n")
              output.write(f"notes_tag_pattern=^{release_core}$|^{re.escape(tag)}$\n")
          PY

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: 0.13.4
          python-version: '3.11'

      - name: Ensure Git 2.54 or newer
        shell: bash
        run: |
          version=$(git --version | awk '{print $3}')
          IFS=. read -r major minor _patch <<< "$version"
          if (( major < 2 || (major == 2 && minor < 54) )); then
            printf 'Git 2.54.0 or newer is required; found %s\n' "$version" >&2
            exit 1
          fi

      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          case "$(uname -m)" in
            x86_64) architecture=x64 ;;
            aarch64|arm64) architecture=arm64 ;;
            *) printf 'Unsupported runner architecture.\n' >&2; exit 1 ;;
          esac
          archive="gitleaks_${version}_linux_${architecture}.tar.gz"
          release="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl --fail --location --silent --show-error "$release/$archive" --output "$RUNNER_TEMP/$archive"
          curl --fail --location --silent --show-error "$release/gitleaks_${version}_checksums.txt" --output "$RUNNER_TEMP/checksums.txt"
          (cd "$RUNNER_TEMP" && grep "  $archive$" checksums.txt | shasum -a 256 --check)
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          install -m 0755 "$RUNNER_TEMP/gitleaks" "$RUNNER_TEMP/bin/gitleaks"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - run: uv sync --locked
      - run: uv run pytest
      - run: uv build

      - name: Generate release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff
        env:
          GIT_CLIFF_TAG_PATTERN: ${{ steps.meta.outputs.notes_tag_pattern }}
        with:
          version: v2.14.1
          config: cliff.toml
          args: --current --output RELEASE_NOTES.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ steps.meta.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          if ! grep -q '^\* ' RELEASE_NOTES.md; then
            printf 'Release notes contain no changelog entries.\n' >&2
            exit 1
          fi
          args=(--verify-tag --notes-file RELEASE_NOTES.md)
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            args+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" dist/* "${args[@]}"
